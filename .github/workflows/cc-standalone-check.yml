name: CC standalone check
# Phase CC U4 recover (cc.design.md section 18): build with the repo's own
# next.config (cacheComponents on), start the standalone server.js like prod
# (pm2 runs the same file), and curl the 404/200 path table twice per path.
# `next dev` skips the revalidate check that gave prod 500 (app-page.js isDev),
# so only this standalone run represents prod. No deploy, no VM, no local run.
on:
  workflow_dispatch:
  push:
    branches: [cc-u4]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Same values as gcp.yml "Build web". Set at job level: NEXT_PUBLIC_* are
      # baked at build, and the standalone server reads them again at runtime.
      NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE || 'https://blog-api.prettylog.com' }}
      NEXT_PUBLIC_CDN_ASSETS: ${{ vars.NEXT_PUBLIC_CDN_ASSETS || 'https://blog-assets.prettylog.com' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://my.prettylog.com' }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_DEFAULT_BLOG_AUTHOR: ${{ vars.NEXT_PUBLIC_DEFAULT_BLOG_AUTHOR || 'taeklim' }}
      NEXT_PUBLIC_GOOGLE_SEARCH_ENGINE: ${{ vars.NEXT_PUBLIC_GOOGLE_SEARCH_ENGINE }}
      NEXT_PUBLIC_GOOGLE_ADSENSE: ${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/types build

      - name: Allowlist matches app/ top-level routes
        run: |
          node _scripts/cc/check-known-top-level.mjs
          node apps/dashboard_client_web/scripts/gen-public-paths.mjs --check

      - name: Build web (standalone, same as gcp.yml)
        run: |
          pnpm --filter dashboard_client_web build
          app=apps/dashboard_client_web
          # standalone omits .next/static and public (S-GCP-22).
          cp -r "$app/.next/static" "$app/.next/standalone/$app/.next/static"
          cp -r "$app/public" "$app/.next/standalone/$app/public"

      - name: Start standalone server
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PROD }}
        run: |
          # HOSTNAME=localhost as in prod (deploy/gcp/web-self-proxy.md): 127.0.0.1 makes Next proxy to itself.
          cd apps/dashboard_client_web/.next/standalone
          PORT=3000 HOSTNAME=localhost nohup node apps/dashboard_client_web/server.js > "$GITHUB_WORKSPACE/server.log" 2>&1 &
          curl -s -o /dev/null --retry 30 --retry-delay 2 --retry-connrefused http://localhost:3000/robots.txt

      - name: Path table (each path twice)
        run: |
          fail=0
          {
            echo '| path | expect | 1st (ISR gen) | 2nd (cached) | result |'
            echo '| --- | --- | --- | --- | --- |'
          } | tee table.md
          hit() { curl -s -o /dev/null -D hdr.txt -w '%{http_code}/%{size_download}B' --max-time 30 "$@"; }
          # check WANT PATH [nocookie]: both hits must return WANT; nocookie = no Set-Cookie.
          check() {
            want="$1"; p="$2"; flag="${3:-}"
            a=$(hit "http://localhost:3000$p"); ca=$(grep -ci '^set-cookie' hdr.txt || true)
            b=$(hit "http://localhost:3000$p"); cb=$(grep -ci '^set-cookie' hdr.txt || true)
            ok=PASS
            [ "${a%%/*}" = "$want" ] && [ "${b%%/*}" = "$want" ] || ok=FAIL
            if [ "$flag" = nocookie ]; then
              [ "$ca$cb" = 00 ] || ok='FAIL(set-cookie)'
              want="$want, no cookie"
            fi
            [ "$ok" = PASS ] || fail=1
            echo "| \`$p\` | $want | $a | $b | $ok |" | tee -a table.md
          }
          for p in /nope /foo/bar /xmlrpc.php /settings /@nobody/about /@nobody/resume /@taeklim/about-me; do check 404 "$p"; done
          for p in / /@taeklim/posts /@taeklim/about /tags/rust; do check 200 "$p"; done
          # A2 rows (diagnosis-architect.md section 7.4)
          chunk=$(ls apps/dashboard_client_web/.next/static/chunks/*.js | head -1 | xargs basename)
          for p in /favicon/favicon.ico /favicon/site.webmanifest /robots.txt /sitemap.xml "/_next/static/chunks/$chunk" \
            /@taeklim/cnn-from-scratch-7-7-139-runs-in-4-days-with-the-rules-written-first/opengraph-image; do check 200 "$p"; done
          for p in /og-image.png /ads.txt /next.svg; do check 200 "$p" nocookie; done
          for p in /wp-login.php /.env /@taeklim/x.png; do check 404 "$p"; done
          # legacy path: 308 to /@taeklim/x.png, then 404 after following
          l1=$(hit "http://localhost:3000/blog/@taeklim/x.png"); loc=$(grep -i '^location:' hdr.txt | tr -d '\r' | sed 's/^[^:]*: *//')
          l2=$(hit -L "http://localhost:3000/blog/@taeklim/x.png")
          ok=PASS; { [ "${l1%%/*}" = 308 ] && [ "${l2%%/*}" = 404 ]; } || { ok=FAIL; fail=1; }
          echo "| \`/blog/@taeklim/x.png\` | 308 then followed 404 | $l1 ($loc), $l2 | | $ok |" | tee -a table.md
          n=$(grep -c 'Invalid revalidate configuration' server.log || true)
          echo "| server.log 'Invalid revalidate configuration' | 0 | $n | | $([ "$n" = 0 ] && echo PASS || echo FAIL) |" | tee -a table.md
          [ "$n" = 0 ] || fail=1
          cat table.md >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      # Anonymous browser pass on the same standalone server (U4 option b, G-a / G-b).
      # The signed-in arm cannot run here: it needs a Clerk session for the prod instance.
      # Limits: localhost has no Cloudflare, so g_a counts requests only; the anon prod
      # baseline is 22-23 per 10 s in W1 (u4-verdict.md), the gate is 27.
      - name: Install Playwright chromium
        if: always()
        run: pnpm exec playwright install --with-deps chromium

      - name: Anonymous browser pass (prefetch per menu link, max requests per 10 s)
        if: always()
        run: |
          node _scripts/perf/cc-browser.mjs --tag u4b-anon --base http://localhost:3000 \
            --arms anon --rails expanded --runs 2 --out "$RUNNER_TEMP/ccb" || true
          node - <<'JS'
          const fs = require('fs');
          const root = process.env.RUNNER_TEMP + '/ccb';
          const dir = root + '/' + fs.readdirSync(root)[0];
          const rows = fs.readFileSync(dir + '/summary.csv', 'utf8').trim().split('\n').slice(1).map((l) => l.split(','));
          const val = (k) => rows.filter((r) => r[2] === k).map((r) => r[7]).join(' ').replace(/"/g, '');
          const maxOf = (k) => Math.max(...val(k).split(' ').map(Number));
          const detail = JSON.parse(fs.readFileSync(dir + '/browser_summary.json', 'utf8'));
          const out = ['| run | menu link | prefetch requests |', '| --- | --- | --- |'];
          for (const d of detail) for (const [h, n] of Object.entries(d.prefetch_per_menu_link ?? {})) out.push(`| ${d.run} | \`${h}\` | ${n} |`);
          const perLink = maxOf('g_b_prefetch_per_menu_link_max');
          const ga = maxOf('g_a_max_10s_w1');
          out.push('', '| metric | values per run | gate | result |', '| --- | --- | --- | --- |');
          out.push(`| prefetch per menu link, max | ${val('g_b_prefetch_per_menu_link_max')} | <= 2 | ${perLink <= 2 ? 'PASS' : 'FAIL'} |`);
          out.push(`| g_a_max_10s_w1 | ${val('g_a_max_10s_w1')} | <= 27 | ${ga <= 27 ? 'PASS' : 'FAIL'} |`);
          out.push(`| g_a_max_10s, w1+w3+w4 (info) | ${val('g_a_max_10s')} | none | |`);
          out.push(`| w1_rsc_total (info) | ${val('w1_rsc_total')} | none | |`);
          console.log(out.join('\n'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n### Anonymous browser pass\n\n' + out.join('\n') + '\n');
          process.exit(perLink <= 2 && ga <= 27 ? 0 : 1);
          JS

      - name: Server log tail
        if: always()
        run: tail -n 60 server.log || true

      - name: Diagnostic (not gating) og:image URL of a real post
        if: always()
        run: |
          s=/@taeklim/cnn-from-scratch-7-7-139-runs-in-4-days-with-the-rules-written-first
          curl -s --max-time 30 "http://localhost:3000$s" > post.html || true
          echo "post page bytes: $(wc -c < post.html)"
          grep -o '<meta[^>]*og:image[^>]*>' post.html | head -3
          u=$(grep -o 'property="og:image" content="[^"]*"' post.html | head -1 | sed 's/.*content="//; s/"$//')
          echo "og:image url: $u"
          [ -n "$u" ] && curl -s -o /dev/null -w 'og:image status %{http_code}/%{size_download}B\n' --max-time 30 "http://localhost:3000$(echo "$u" | sed 's|^https\?://[^/]*||')" || true
