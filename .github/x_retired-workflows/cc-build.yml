name: CC build only
# Retired 2026-10-14 (CC-D2): cacheComponents is on in next.config.ts
# Phase CC U3: build the web app with cacheComponents ON inside the runner, to
# list what U4 must fix. No deploy, no VM transfer, no secrets. The repo's
# next.config.ts stays flag-off (production build is unchanged).
on:
  workflow_dispatch:
    inputs:
      cache_components:
        description: 'Turn cacheComponents on inside this runner'
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The web app resolves @repo/types from its dist (no turbo ^build here).
      - run: pnpm --filter @repo/types build

      - name: Turn the flag on (runner copy only)
        if: ${{ inputs.cache_components }}
        run: |
          sed -i 's/^const nextConfig: NextConfig = {$/&\n    cacheComponents: true,/' apps/dashboard_client_web/next.config.ts
          grep -n 'cacheComponents' apps/dashboard_client_web/next.config.ts
          # Preview U4: the flag rejects route segment 'dynamic'; drop it here only.
          grep -rl "export const dynamic = 'force-dynamic'" apps/dashboard_client_web/app \
            | xargs -r sed -i "/export const dynamic = 'force-dynamic';/d"
          grep -rn "export const dynamic" apps/dashboard_client_web/app || echo 'no route dynamic left'

      - name: Build web
        # Same env as gcp.yml "Build web" (NEXT_PUBLIC_* are baked at build time).
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE || 'https://blog-api.prettylog.com' }}
          NEXT_PUBLIC_CDN_ASSETS: ${{ vars.NEXT_PUBLIC_CDN_ASSETS || 'https://blog-assets.prettylog.com' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://my.prettylog.com' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_DEFAULT_BLOG_AUTHOR: ${{ vars.NEXT_PUBLIC_DEFAULT_BLOG_AUTHOR || 'taeklim' }}
          NEXT_PUBLIC_GOOGLE_SEARCH_ENGINE: ${{ vars.NEXT_PUBLIC_GOOGLE_SEARCH_ENGINE }}
          NEXT_PUBLIC_GOOGLE_ADSENSE: ${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE }}
        run: pnpm --filter dashboard_client_web build
