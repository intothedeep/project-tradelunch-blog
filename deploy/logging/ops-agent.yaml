# Google Cloud Ops Agent config for the blog-api VM (decision #55, step ②).
# Apply: deploy/logging/README.md §②. Copy to /etc/google-cloud-ops-agent/config.yaml,
# then restart google-cloud-ops-agent.
#
# The Ops Agent MERGES this file with its built-in defaults (host metrics + syslog).
# The VM's stock config.yaml is comments only, so this file adds the blog-api
# pipeline and leaves the defaults alone; it does not redefine them.
#
# Ships the pino JSON lines PM2 writes (apps/dashboard_server/src/lib/logger.ts).
# Log name in Cloud Logging = the receiver id: log_id("blog-api").
logging:
  receivers:
    blog-api:
      type: files
      include_paths:
        - /home/tio_taek_lim/.pm2/logs/blog-api-out-0.log
        - /home/tio_taek_lim/.pm2/logs/blog-api-error-0.log
    # Next.js request log (decision #58, apps/dashboard_client_web/proxy.ts).
    # Wildcard because the PM2 id changes; rotated files end in a date or .gz,
    # so they do not match *.log. Next's non-JSON startup lines ("▲ Next.js ...")
    # fail parse_json and stay as plain text entries.
    blog-web:
      type: files
      include_paths:
        - /home/tio_taek_lim/.pm2/logs/blog-web-out-*.log
        - /home/tio_taek_lim/.pm2/logs/blog-web-error-*.log
  processors:
    blog_api_json:
      # No time_key: pino writes ISO time ending in "Z"; the entry uses the
      # read time instead (≤ a few seconds later). The original stays in jsonPayload.time.
      type: parse_json
    blog_api_severity:
      # parse_json leaves pino's "severity" inside jsonPayload, so entries showed no
      # severity in Logs Explorer (seen 2026-10-13). Move it to the LogEntry field.
      type: modify_fields
      fields:
        severity:
          move_from: jsonPayload.severity
    blog_web_json:
      type: parse_json
    blog_web_severity:
      # Same reason as blog_api_severity: lift severity out of jsonPayload.
      type: modify_fields
      fields:
        severity:
          move_from: jsonPayload.severity
  service:
    pipelines:
      blog_api:
        receivers: [blog-api]
        processors: [blog_api_json, blog_api_severity]
      blog_web:
        receivers: [blog-web]
        processors: [blog_web_json, blog_web_severity]
